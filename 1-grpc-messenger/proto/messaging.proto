syntax = "proto3";
package messenger;

service Messaging {
  rpc SendMessage (SendRequest) returns (SendReply);
  rpc MessageStream (StreamRequest) returns (stream Message);
}

message SendRequest { string sender = 1; string text = 2; }
message SendReply { bool ok = 1; string error = 2; }
message StreamRequest { string user = 1; }
message Message { string sender = 1; string text = 2; int32 clock = 3; }
